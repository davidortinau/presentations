abstract: Come learn how Microsoft is evolving Xamarin.Forms into the next generation application development toolkit. Whether you are buildings an app for one platform or many, .NET MAUI will deliver the most productive development experience as you target Android, iOS, macOS, Windows, and beyond. The future of .NET app development is being shaped in the open, and we want you to be involved!
