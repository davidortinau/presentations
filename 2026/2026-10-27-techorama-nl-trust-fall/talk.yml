abstract: |
  AI has gone beyond the chat window. It is making decisions on your behalf, whether you are watching or not. The difference between this story being a horror thriller and an adventure full of whimsy is none other than the protagonist: you.

  How much users trust any app has everything to do with how it is implemented, the patterns and practices of sound engineering and user interaction design that have always mattered. In this session we'll work through the design patterns shaping agentic UX in 2026: progress ledgers, confidence signals, sandbox previews, autonomy gradients, and the art of the well-placed human-in-the-loop. We'll look at examples of where it is going right, and where it has been frighteningly wrong.

  I'll show you have to implement these patterns using .NET MAUI, Blazor, Microsoft.Extensions.AI, and the Microsoft Agent Framework across mobile, desktop, and web — and you'll leave with a clear engineering recipe for shipping agents your users actually trust.
