abstract: |
  Ever since we introduced .NET MAUI we have heard the same chorus of celebration: developers love Blazor Hybrid with .NET MAUI! And we continue to add and improve the experience with every release. In this session I'll cover the breadth of what you can do with a hybrid solution, from maximizing your code share across platforms to plumbing the depths of native device features. You may be astonished just how great the apps can be!
