title: .NET 6 deep dive; what's new and what's coming | OD485
date: 2021-05
event: Build 2021
city: Online
format: session
abstract: .NET 6 is the next version of .NET, a modern, open-source development platform for building apps for any OS with the best performance and productivity. .NET 6 completes the unification of the platform and adds new capabilities for building web, native and hybrid apps for Linux, Windows, Mac, iOS and Android with a single codebase. See how to write less code, target more devices and build cloud native apps faster. Learn how to move your .NET Framework apps forward with the .NET Upgrade Assistant.
