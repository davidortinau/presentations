abstract: The hope and dream of every developer to is creating amazing mobile experiences that people love to use and their fellow developers all envy. What does it require to truly take your work from just "ok, that's a good job" to "how in the world did _____ do that?!" In this session David will spill the beans on how you can make your mobile app the one that everyone is talking about. You'll learn tips and tricks along the way for using Xamarin to make you more productive and innovative in your everyday work.
