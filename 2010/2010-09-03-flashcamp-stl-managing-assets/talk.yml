abstract: We want projects with more video, audio, graphics, animation, and all with increasingly complex interactivity. In this session I'll present several strategies my teams have found effective for managing and implementing a wide variety of media assets. We'll discuss SWCs, RSLs, meta tag embedding, bulk loaders, and more. This session will be geared towards both designers and developers.
