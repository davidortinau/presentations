title: Build .NET MAUI Apps with DevOps
date: '2023-11-16'
event: .NET Conf 2023
city: Online
format: session
abstract: In this session, we'll walk through DevOps pipelines to show how to build .NET MAUI apps. We'll also share some tips and tricks, tips on how to optimize your builds. We'll look at sample pipelines in GitHub Actions and Azure DevOps, discuss signing the apps for distribution and running Unit Tests as part of the pipeline.
