abstract: Join .NET MAUI product managers for the latest updates on .NET MAUI, a productive and flexible way to build native cross-platform mobile and desktop apps. Learn how to create beautiful and performant experiences for your users from a single codebase, reusing your business logic and web UI. Get a sneak peek at the roadmap for .NET 8 and beyond and ask your pressing questions.
