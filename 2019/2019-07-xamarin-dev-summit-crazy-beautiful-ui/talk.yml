title: Let's Make Crazy Beautiful UI With Xamarin.Forms
date: 2019-07
event: Xamarin Developer Summit 2019
city: Houston, United States
format: talk
session_url: https://learn.microsoft.com/en-us/shows/xamarin-xamarin-developer-summit-2019/lets-make-crazy-beautiful-ui-with-xamarinforms
abstract: |
  Xamarin.Forms may have been originally considered best for building rapid prototypes, but customers have shown us time and again that the only limits to its power is your imagination. In this session we'll take 4 beautiful designs and demonstrate the techniques used to create them. We'll cover layout, styling, bindings, animations, behaviors, drawing, and more.
